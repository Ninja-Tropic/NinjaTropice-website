services:
  db:
    image: mysql:8.0
    container_name: ninjatropice_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - wordpress_net

  wordpress:
    build: .
    container_name: ninjatropice_wp
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
    volumes:
      - wp_data:/var/www/html
      - ./themes:/var/www/html/wp-content/themes
      - ./plugins:/var/www/html/wp-content/plugins
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./uploads:/var/www/html/wp-content/uploads
      - ./php-config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - wordpress_net

  browsersync:
    image: node:20-alpine
    container_name: ninjatropice_bs
    working_dir: /app
    volumes:
      - ./themes/NinjaTheme:/app
      - theme_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    environment:
      WP_URL: http://wordpress:80
      WP_PUBLIC_URL: http://localhost:8080
      SHELL: /bin/sh
    depends_on:
      - wordpress
    networks:
      - wordpress_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ninjatropice_pma
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - wordpress_net

volumes:
  db_data:
  wp_data:
  theme_node_modules:

networks:
  wordpress_net:
    driver: bridge
